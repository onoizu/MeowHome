<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cat adoption listings, preference matching, care guides and adoption diaries."
    />
    <meta name="theme-color" content="#3d6755" />
    <title>Cat adoption | MeowHome</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <!-- 样式与结构分离：base 是全站组件，pages 是页面专用布局。 -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <!-- 首页独立样式：大图、纯照片网格和悬停资料。 -->
    <link rel="stylesheet" href="css/home.css" />
    <!-- defer 保证 HTML 解析后按顺序执行，不使用框架或构建工具。 -->
    <script src="js/data.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/translations.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/home.js" defer></script>
  </head>
  <body>
    <!-- 本文件职责：精简首页。主图、照片式猫咪展示与三个主要功能入口。 -->
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- 公共导航：每个 HTML 保留相同结构，可直接学习和编辑。 -->
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="MeowHome home"
          ><span class="brand-name"
            >MeowHome<span class="brand-dot">.</span></span
          ></a
        >
        <nav class="desktop-nav" id="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <div class="nav-dropdown">
            <button
              class="nav-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="adoption-menu"
            >
              Adopt &amp; rehome
            </button>
            <div class="nav-dropdown-panel" id="adoption-menu" hidden>
              <a href="discover.html">Find a cat</a
              ><a href="rehome.html">Rehome a cat</a
              ><a href="match.html">Find your match</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button
              class="nav-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="care-menu"
            >
              Cat care
            </button>
            <div class="nav-dropdown-panel" id="care-menu" hidden>
              <a href="guides.html">Beginner guides</a
              ><a href="guides.html#checklist">Preparation checklist</a>
            </div>
          </div>
          <a href="stories.html">Adoption diaries</a>
          <a href="dashboard.html" id="profile-nav" hidden>Profile</a>
        </nav>
        <div class="header-actions">
          <a class="account-link" id="account-link" href="login.html"
            ><span>Sign in</span></a
          >
          <div
            class="language-switch"
            role="group"
            aria-label="Website language"
            data-no-translate
          >
            <button
              type="button"
              data-language="en"
              lang="en"
              aria-label="Switch to English"
              aria-pressed="true"
            >
              EN</button
            ><span aria-hidden="true">/</span
            ><button
              type="button"
              data-language="zh-Hant"
              lang="zh-Hant"
              aria-label="切換至繁體中文"
              aria-pressed="false"
            >
              繁體
            </button>
          </div>
          <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="main-nav"
          >
            Menu
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="home-main">
      <!-- 首页只保留主图、猫咪照片与主要入口，完整资料放在详情页。 -->
      <section class="home-hero" aria-labelledby="home-title">
        <img
          src="assets/images/hero.jpg"
          alt="A relaxed cat enjoying a quiet moment"
          fetchpriority="high"
        />
        <div class="container home-hero-inner">
          <div class="home-hero-copy">
            <h1 id="home-title">Cat adoption</h1>
            <a class="home-primary-link" href="discover.html">Find a cat</a>
          </div>
        </div>
      </section>
      <section class="home-gallery container" aria-labelledby="gallery-title">
        <div class="home-section-head">
          <h2 id="gallery-title">Cats for adoption</h2>
          <a class="home-text-link" href="discover.html">View all cats</a>
        </div>
        <div class="home-photo-grid" id="featured-cats"></div>
      </section>
      <section class="home-next" aria-label="More from MeowHome">
        <div class="container home-next-links">
          <a href="match.html">Find your match</a
          ><a href="guides.html">Cat care</a
          ><a href="stories.html">Adoption diaries</a>
        </div>
      </section>
    </main>
    <!-- 公共页脚：示例信息、页面导航与参考来源。 -->
    <footer class="site-footer home-footer">
      <div class="container">
        <div class="home-footer-top">
          <a class="brand" href="index.html"
            ><span class="brand-name"
              >MeowHome<span class="brand-dot">.</span></span
            ></a
          ><a class="home-text-link" href="rehome.html">Rehome a cat</a>
        </div>
        <div class="footer-bottom">
          <span>© 2026 MeowHome</span>
        </div>
      </div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
